name: Build APK Genetik

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL website (http:// atau https://)'
        required: true
        type: string
      app_name:
        description: 'Nama aplikasi'
        required: true
        type: string
      icon_url:
        description: 'URL icon PNG/JPG (opsional)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  CORDOVA_VERSION: '13.0.0'
  CORDOVA_ANDROID_VERSION: '13.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Cordova
        run: |
          set -euo pipefail
          npm install --global cordova@${CORDOVA_VERSION}
          cordova --version

      - name: Validate build inputs
        env:
          WEBSITE_URL: ${{ inputs.url }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from urllib.parse import urlparse

          url = os.environ.get('WEBSITE_URL', '').strip()
          name = os.environ.get('APP_NAME', '').strip()

          if not name:
              raise SystemExit('Nama aplikasi kosong.')
          if len(name) > 50:
              raise SystemExit('Nama aplikasi terlalu panjang (maksimal 50 karakter).')

          parsed = urlparse(url)
          if parsed.scheme not in ('http', 'https') or not parsed.netloc:
              raise SystemExit('Website URL harus berupa URL lengkap dengan http:// atau https://')

          print('Input build valid.')
          print('Nama:', name)
          print('URL :', url)
          PY

      - name: Create Cordova project
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -euo pipefail
          rm -rf app
          cordova create app com.genetik.app "$APP_NAME"

      - name: Configure website and icon
        env:
          WEBSITE_URL: ${{ inputs.url }}
          ICON_URL: ${{ inputs.icon_url }}
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p resources

          # Configure website URL.
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from urllib.parse import urlparse

          url = os.environ['WEBSITE_URL'].strip()
          parsed = urlparse(url)
          if parsed.scheme not in ('http', 'https') or not parsed.netloc:
              raise SystemExit('Website URL tidak valid.')

          tree = ET.parse('config.xml')
          root = tree.getroot()

          def find_or_create(tag):
              node = root.find(tag)
              if node is None:
                  node = ET.SubElement(root, tag)
              return node

          content = root.find('content')
          if content is None:
              content = ET.SubElement(root, 'content')
          content.set('src', url)

          access = root.find("access[@origin='*']")
          if access is None:
              ET.SubElement(root, 'access', {'origin': '*'})

          navigation = root.find("allow-navigation[@href='*']")
          if navigation is None:
              ET.SubElement(root, 'allow-navigation', {'href': '*'})

          tree.write('config.xml', encoding='utf-8', xml_declaration=True)
          print('Website URL:', url)
          PY

          # Download icon only when supplied. Any bad optional icon falls back
          # to a generated PNG so it cannot break the Android platform step.
          if [ -n "${ICON_URL:-}" ]; then
            echo "Mengunduh icon..."
            if curl --fail --location --silent --show-error --retry 3 \
              --connect-timeout 15 --max-time 60 \
              "$ICON_URL" -o resources/icon-source; then
              echo "Icon berhasil diunduh."
            else
              echo "Icon gagal diunduh; memakai icon fallback."
              rm -f resources/icon-source
            fi
          else
            echo "icon_url kosong; memakai icon fallback."
          fi

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          source = Path('resources/icon-source')
          output = Path('resources/icon.png')

          try:
              if not source.exists() or source.stat().st_size == 0:
                  raise ValueError('icon source tidak ada')

              with Image.open(source) as im:
                  im = im.convert('RGBA')
                  im.thumbnail((1024, 1024), Image.Resampling.LANCZOS)
                  canvas = Image.new('RGBA', (1024, 1024), (24, 24, 24, 255))
                  x = (1024 - im.width) // 2
                  y = (1024 - im.height) // 2
                  canvas.alpha_composite(im, (x, y))
                  canvas.save(output, 'PNG')
              print('Icon input berhasil dikonversi ke PNG.')
          except Exception as exc:
              print(f'Icon input tidak valid ({exc}); membuat fallback.')
              canvas = Image.new('RGBA', (1024, 1024), (24, 24, 24, 255))
              draw = ImageDraw.Draw(canvas)
              draw.rounded_rectangle((96, 96, 928, 928), radius=160, fill=(45, 45, 45, 255))
              draw.text((460, 390), 'G', fill=(255, 255, 255, 255))
              canvas.save(output, 'PNG')
          finally:
              source.unlink(missing_ok=True)
          PY

          # Tell Cordova which launcher icon to use before Android is added.
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          tree = ET.parse('config.xml')
          root = tree.getroot()

          for node in list(root):
              if node.tag == 'icon':
                  root.remove(node)

          ET.SubElement(root, 'icon', {'src': 'resources/icon.png'})
          tree.write('config.xml', encoding='utf-8', xml_declaration=True)
          print('Launcher icon dikonfigurasi.')
          PY

      - name: Install Android platform
        working-directory: app
        run: |
          set -euo pipefail
          npm install --save-exact cordova-android@${CORDOVA_ANDROID_VERSION}
          cordova platform add android@${CORDOVA_ANDROID_VERSION} --no-save
          cordova platform ls

      - name: Build APK
        working-directory: app
        run: |
          set -euo pipefail
          cordova build android --release

      - name: Verify APK
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find app/platforms/android -type f -name '*.apk' -print)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo 'APK tidak ditemukan setelah build.'
            exit 1
          fi
          printf 'APK ditemukan: %s\n' "${APKS[@]}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/platforms/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
