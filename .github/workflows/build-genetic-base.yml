name: Build APK Genetik
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL website'
        required: true
      app_name:
        description: 'Nama aplikasi'
        required: true
      icon_url:
        description: 'URL icon'
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
        run: |
          set -e
          npm install -g cordova
          cordova create app com.genetik.app "$APP_NAME"
          cd app
          cordova platform add android
      - name: Configure website URL
        env:
          WEBSITE_URL: ${{ github.event.inputs.url }}
        run: |
          set -e
          test -n "$WEBSITE_URL"
          cd app
          node -e 'const fs=require("fs"); const p="config.xml"; let s=fs.readFileSync(p,"utf8"); const u=process.env.WEBSITE_URL.replace(/&/g,"&amp;").replace(/"/g,"&quot;"); s=s.replace(/<content[^>]*src="[^"]*"[^>]*/>/, "<content src=""+u+"" />"); fs.writeFileSync(p,s);'
      - name: Build APK
        run: |
          set -e
          cd app
          cordova build android --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/platforms/android/app/build/outputs/apk/release/*.apk
