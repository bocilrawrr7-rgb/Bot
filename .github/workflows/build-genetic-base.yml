name: Build APK Genetik

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL website (http:// atau https://)'
        required: true
        type: string
      app_name:
        description: 'Nama aplikasi'
        required: true
        type: string
      icon_url:
        description: 'URL icon PNG/JPG (opsional)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova tools
        run: |
          set -e
          npm install --global cordova cordova-res
          cordova --version
          cordova-res --version

      - name: Validate build inputs
        env:
          WEBSITE_URL: ${{ inputs.url }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -e
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          url = os.environ.get('WEBSITE_URL', '').strip()
          name = os.environ.get('APP_NAME', '').strip()

          if not name:
              raise SystemExit('Nama aplikasi kosong.')

          if len(name) > 50:
              raise SystemExit('Nama aplikasi terlalu panjang (maksimal 50 karakter).')

          parsed = urlparse(url)
          if parsed.scheme not in ('http', 'https') or not parsed.netloc:
              raise SystemExit('Website URL harus berupa URL lengkap dengan http:// atau https://')

          print('Input build valid.')
          print('Nama:', name)
          print('URL :', url)
          PY

      - name: Create Cordova project
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -e
          cordova create app com.genetik.app "$APP_NAME"

      - name: Configure website URL
        env:
          WEBSITE_URL: ${{ inputs.url }}
        working-directory: app
        run: |
          set -e
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from urllib.parse import urlparse

          url = os.environ['WEBSITE_URL'].strip()
          parsed = urlparse(url)

          if parsed.scheme not in ('http', 'https') or not parsed.netloc:
              raise SystemExit('Website URL tidak valid.')

          tree = ET.parse('config.xml')
          root = tree.getroot()

          content = root.find('content')
          if content is None:
              content = ET.SubElement(root, 'content')

          content.set('src', url)

          # Pastikan akses network tersedia untuk website eksternal.
          has_access = False
          for access in root.findall('access'):
              if access.get('origin') == '*':
                  has_access = True
                  break
          if not has_access:
              ET.SubElement(root, 'access', {'origin': '*'})

          tree.write('config.xml', encoding='utf-8', xml_declaration=True)
          print('Website URL berhasil dikonfigurasi:', url)
          PY

      - name: Prepare icon
        env:
          ICON_URL: ${{ inputs.icon_url }}
        working-directory: app
        run: |
          set -e
          mkdir -p resources

          if [ -n "${ICON_URL:-}" ]; then
            echo "Mengunduh icon..."
            if curl --fail --location --silent --show-error --retry 3 \
              --connect-timeout 15 --max-time 60 \
              "$ICON_URL" -o resources/icon.png; then
              echo "Icon berhasil diunduh."
            else
              echo "Peringatan: icon gagal diunduh. Menggunakan icon bawaan."
              rm -f resources/icon.png
            fi
          else
            echo "icon_url kosong. Menggunakan icon bawaan."
          fi

          # Jika icon tidak tersedia/invalid, buat PNG fallback agar proses
          # resource Android tetap deterministik dan tidak gagal.
          if [ ! -s resources/icon.png ] || ! file resources/icon.png | grep -qiE 'PNG|JPEG'; then
            echo "Membuat icon fallback 1024x1024..."
            rm -f resources/icon.png
            python3 -m pip install --disable-pip-version-check --quiet Pillow
            python3 - <<'PY'
          from PIL import Image, ImageDraw

          size = 1024
          image = Image.new('RGBA', (size, size), (24, 24, 24, 255))
          draw = ImageDraw.Draw(image)
          margin = 96
          draw.rounded_rectangle(
              (margin, margin, size - margin, size - margin),
              radius=160,
              fill=(45, 45, 45, 255),
          )
          draw.textbbox((0, 0), 'G')
          draw.text((430, 300), 'G', fill=(255, 255, 255, 255))
          image.save('resources/icon.png', 'PNG')
          PY
          fi

          file resources/icon.png

      - name: Add Android platform
        working-directory: app
        run: |
          set -e
          cordova platform add android

      - name: Generate Android launcher icons
        working-directory: app
        run: |
          set -e
          cordova-res android --copy
          echo "Launcher icon berhasil diproses."

      - name: Build APK
        working-directory: app
        run: |
          set -e
          cordova build android --release

      - name: Verify APK
        run: |
          set -e
          APK_COUNT=$(find app/platforms/android -type f -name '*.apk' | wc -l)
          if [ "$APK_COUNT" -lt 1 ]; then
            echo 'APK tidak ditemukan setelah build.'
            exit 1
          fi
          echo "APK ditemukan: $APK_COUNT file"
          find app/platforms/android -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/platforms/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
